services:
  domarchy:
    build:
      context: .
      dockerfile: Dockerfile
    image: overthinkinglabs/domarchy:latest
    container_name: domarchy
    volumes:
      - ./data:/data
      - ./shared:/shared
      - /run/user/1000/pulse/native:/tmp/pulse.socket
      - ${HOME}/.config/pulse/cookie:/tmp/pulse.cookie:ro
    ports:
      - "5900:5900"
      - "8900:8900"
    environment:
      - DISPLAY=:0
      - MEMORY=8G
      - CPUS=4
      # The guest framebuffer size. noVNC scales this to fit the browser window
      # (resize: scale), so this sets sharpness rather than window size. There is
      # no host GPU passed through, so Hyprland composites via llvmpipe on the
      # CPU -- 4K costs over twice the pixels of 1440p for no visible gain once
      # it is scaled into a browser. Raise if you have cores to spare.
      - XRES=2560
      - YRES=1440
      - PULSE_SERVER=unix:/tmp/pulse.socket
      - PULSE_COOKIE=/tmp/pulse.cookie
    deploy:
      resources:
        limits:
          # Must exceed MEMORY: QEMU needs overhead beyond the guest allocation
          # for page tables, device emulation and the VGA framebuffer, plus
          # websockify. A limit equal to MEMORY gets the container OOMKilled
          # once the guest touches most of its RAM.
          memory: 10G
        reservations:
          memory: 8G
    restart: no
    privileged: true
